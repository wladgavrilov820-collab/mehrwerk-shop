spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

logging:
  level:
    org.springframework.cache.interceptor: TRACE

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=mehrwerk_shop;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  application:
    name: mehrwerk-shop


mehrwerk:
  api:
    base-url: https://testapi.mehrwerk.de
    key: ${MEHRWERK_API_KEY}
    client-id: ${MEHRWERK_CLIENT_ID}
    client-secret: ${MEHRWERK_CLIENT_SECRET}
